    pair_count: 5
    canonical_pairs_sha256: d63c8ca304f5d382d7e220e9e12d0b0040a8b988e919a310b43a674148c5d134

model_selection:
  split: geometry_grouped
  checkpoint_rule: minimum_macro_validation_composite_loss
  tuning_budget:
    screening_seeds: [20260904]
    confirmation_seeds: [20260904, 20260905, 20260906]
  forbidden_until_locked:
    - geometry_grouped_test_target_metrics
    - auxiliary_test_target_metrics
  final_reporting:
    aggregation: macro_mean_over_complete_cases
    uncertainty: mean_and_95_percent_seed_interval
    seed_count: 3

field_reconstruction:
  model_pixel_size_m: 1.0
  physical_patch_size_m: 256.0
  patch_pixels: 256
  stride_pixels: 128
  boundary: periodic
  blending: clamped_nonperiodic_Hann
  hann_floor: 0.001
  target_reconstruction: identical_coordinates_and_weights_as_prediction
  final_accuracy_partition: geometry_grouped.test

metrics:
  primary:
    - Uped/physical_m_s/mae
    - Uped/physical_m_s/rmse
    - Uped/physical_m_s/relative_l2
    - TKEped/physical_m2_s2/mae
  secondary:
    - component_velocity_errors
    - vector_magnitude_and_direction_errors
    - near_building_errors
    - high_gradient_errors
    - Pearson_spatial_correlation
    - horizontal_divergence_slice_diagnostic
    - uncertainty_NLL_and_coverage
  region_thresholds:
    near_building_distance_m: 8.0
    high_gradient_quantile: 0.90
    minimum_direction_speed_m_s: 0.10
  caveats:
    - Horizontal divergence is a 2D slice diagnostic, not 3D mass conservation.
    - Uped is evaluated as an independent released variable, not forced to sqrt(uped^2+vped^2).

latency:
  run_after_model_and_hyperparameters_are_locked: true
  exclusive_gpu_required: true
  hardware:
    gpu: NVIDIA GeForce RTX 4090 D
    gpu_count: 1
    cpu_quota_vcpu: 16
  precision: CUDA_amp_float16
  patch_model_only:
    input_shape_per_sample: [6, 256, 256]
    batch_sizes: [1, 4]
    warmup_repeats: 20
    measured_repeats: 100
    synchronization: torch_cuda_synchronize_before_and_after
    statistics: [median, p90, mean, standard_deviation]
  full_field_deployment:
    target_fields_loaded: false
    target_reconstruction_and_metrics_included: false
    batch_size: 4
    warmup_repeats_per_case: 1
    measured_repeats_per_case: 5
    report_phases:
      - geometry_file_load
      - input_preprocessing
      - host_to_device
      - GPU_forward
      - device_to_host
      - overlap_add_stitching
      - total_online
    sentinel_selection: nearest_area_quantiles_0_25_50_75_100_from_geometry_grouped_test
    sentinel_case_ids:
      - VS64-CL-28_d00
      - UA16_d00
      - US-Det-U6_d90
      - TA-DC-U1_d00
      - US-WestPhoenix
  speedup_reporting:
    formula: matched_CFD_wall_seconds / surrogate_total_online_seconds
    require_same_case_and_documented_CFD_resources: true
    prohibit_using_GPU_forward_only_as_CFD_speedup: true
