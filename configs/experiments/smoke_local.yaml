name: smoke_local
seed: 20260904
deterministic: true
output_dir: runs/smoke_local

data:
  root: .
  split_manifest: configs/splits/splits_v1.json
  protocol: geometry_grouped
  targets: [uped, vped, Uped, TKEped]
  patch_size_m: 64
  output_pixels: 64
  patches_per_case_train: 1
  patches_per_case_eval: 1
  height_scale_m: 50
  sdf_scale_m: 64
  u_tau_reference_m_s: 0.21
  max_cache_cases: 1
  max_train_cases: 2
  max_val_cases: 2

model:
  name: multitask_unet
  base_channels: 8
  depth: 3
  predict_uncertainty: true

loss:
  task_weights: [1.0, 1.0, 1.0, 1.0]
  gradient_weight: 0.05
  use_uncertainty: true

training:
  device: auto
  epochs: 1
  batch_size: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_accumulation: 1
  num_workers: 0
  pin_memory: false
  amp: true
  max_steps_per_epoch: 2
  max_val_batches: 2

