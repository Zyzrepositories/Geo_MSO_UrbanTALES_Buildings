[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbantales-ml"
version = "0.1.0"
description = "Reproducible UrbanTALES surrogate-model research pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.1",
  "scipy>=1.11,<1.15",
  "netCDF4>=1.6,<1.8",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<2.6",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
viz = [
  "matplotlib>=3.8,<3.11",
  "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

